<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Forge3D — AI 3D Generator</title>

<style>

* {
    box-sizing: border-box;
}

:root {
    --bg: #090a0d;
    --panel: #101216;
    --panel2: #15171c;
    --border: #272a31;
    --text: #f5f5f5;
    --muted: #8d929c;
}

body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: Arial, Helvetica, sans-serif;
    height: 100vh;
    overflow: hidden;
}

header {
    height: 64px;
    border-bottom: 1px solid var(--border);
    background: #0c0e11;
    display: flex;
    align-items: center;
    padding: 0 22px;
}

.logo {
    display: flex;
    align-items: center;
    gap: 11px;
    font-size: 18px;
    font-weight: 700;
}

.logoBox {
    width: 34px;
    height: 34px;
    border-radius: 9px;
    background: white;
    color: black;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 900;
}

nav {
    margin-left: 45px;
    display: flex;
    gap: 5px;
}

nav button {
    background: transparent;
    border: none;
    color: var(--muted);
    padding: 9px 14px;
    border-radius: 7px;
    cursor: pointer;
}

nav button:hover,
nav button.active {
    color: white;
    background: #1b1e24;
}

.headerRight {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 12px;
}

.credit {
    border: 1px solid var(--border);
    background: #15171c;
    padding: 8px 12px;
    border-radius: 7px;
    color: #aaaeb7;
    font-size: 12px;
}

.avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: #272a31;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
}

.app {
    height: calc(100vh - 64px);
    display: grid;
    grid-template-columns: 370px 1fr;
}

.sidebar {
    border-right: 1px solid var(--border);
    padding: 27px;
    overflow-y: auto;
}

.sidebar h1 {
    margin: 0;
    font-size: 27px;
}

.subtitle {
    color: var(--muted);
    font-size: 13px;
    line-height: 1.5;
    margin-top: 8px;
    margin-bottom: 27px;
}

.label {
    font-size: 12px;
    color: #bfc3ca;
    margin-bottom: 8px;
    display: block;
}

.modeButtons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 7px;
    margin-bottom: 22px;
}

.modeButton {
    border: 1px solid var(--border);
    background: #14161b;
    color: #969ba4;
    padding: 11px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 12px;
}

.modeButton.active {
    background: #22252b;
    color: white;
    border-color: #42464e;
}

textarea {
    width: 100%;
    height: 145px;
    resize: vertical;
    background: #13151a;
    border: 1px solid var(--border);
    border-radius: 9px;
    color: white;
    padding: 13px;
    font-family: inherit;
    font-size: 13px;
    line-height: 1.5;
    outline: none;
}

textarea:focus {
    border-color: #555a63;
}

.quick {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 8px;
}

.quick button {
    border: 1px solid var(--border);
    background: #14161a;
    color: #999fa8;
    border-radius: 6px;
    padding: 6px 8px;
    font-size: 10px;
    cursor: pointer;
}

.quick button:hover {
    color: white;
    background: #1d2026;
}

.uploadArea {
    width: 100%;
}

.upload {
    display: flex;
    min-height: 145px;
    width: 100%;
    border: 1px dashed #3a3e47;
    border-radius: 9px;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    cursor: pointer;
    background: #121419;
    text-align: center;
}

.upload:hover {
    background: #181b21;
}

.uploadIcon {
    font-size: 28px;
    margin-bottom: 8px;
}

.uploadText {
    font-size: 12px;
    color: #a7acb5;
}

.imageSelected {
    display: none;
    background: #121419;
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 10px;
}

#imagePreview {
    width: 100%;
    max-height: 190px;
    object-fit: contain;
    background: #090a0d;
    border-radius: 7px;
    display: block;
}

.imageInfo {
    margin-top: 9px;
    font-size: 11px;
    color: #bfc3ca;
    overflow: hidden;
}

#imageName {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

#imageSize {
    color: #737984;
    margin-top: 3px;
}

.removeImage {
    width: 100%;
    margin-top: 9px;
    padding: 8px;
    border: 1px solid #30343c;
    border-radius: 6px;
    background: #191c21;
    color: #aaaeb7;
    cursor: pointer;
}

.removeImage:hover {
    background: #24272d;
    color: white;
}

.settings {
    margin-top: 23px;
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    padding: 12px 0;
}

.setting {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 9px 0;
    color: #b6bac2;
    font-size: 12px;
}

select {
    background: #17191e;
    color: white;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 8px;
}

.switch {
    position: relative;
    width: 35px;
    height: 19px;
}

.switch input {
    display: none;
}

.slider {
    position: absolute;
    inset: 0;
    background: #292c32;
    border-radius: 20px;
    cursor: pointer;
}

.slider:before {
    content: "";
    position: absolute;
    width: 15px;
    height: 15px;
    left: 2px;
    top: 2px;
    background: #858a93;
    border-radius: 50%;
    transition: .2s;
}

input:checked + .slider {
    background: #eeeeee;
}

input:checked + .slider:before {
    transform: translateX(16px);
    background: #111;
}

.generate {
    width: 100%;
    margin-top: 20px;
    border: none;
    border-radius: 8px;
    background: white;
    color: black;
    padding: 13px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.generate:hover {
    background: #dedede;
}

.generate:disabled {
    opacity: .45;
    cursor: wait;
}

.status {
    min-height: 24px;
    margin-top: 10px;
    font-size: 11px;
    color: #888e98;
    line-height: 1.4;
}

.viewerArea {
    position: relative;
    background:
        radial-gradient(
            circle at center,
            #1b1e24 0%,
            #0a0b0e 65%
        );
}

#viewer {
    position: absolute;
    inset: 0;
}

.empty {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    pointer-events: none;
    color: #707680;
}

.emptyCube {
    width: 80px;
    height: 80px;
    border: 1px solid #373b43;
    border-radius: 13px;
    margin: auto auto 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 900;
    color: #555a63;
}

.empty h2 {
    color: #a8adb5;
    font-size: 16px;
    margin: 0 0 6px;
}

.empty p {
    font-size: 12px;
    margin: 0;
}

.viewerControls {
    position: absolute;
    right: 20px;
    bottom: 20px;
    display: flex;
    gap: 7px;
}

.viewerControls button {
    border: 1px solid #30343c;
    background: #15181d;
    color: white;
    border-radius: 7px;
    padding: 9px 12px;
    cursor: pointer;
    font-size: 11px;
}

.viewerControls button:hover {
    background: #22262c;
}

.viewerControls button:disabled {
    opacity: .35;
    cursor: not-allowed;
}

.loading {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    display: none;
    z-index: 10;
}

.spinner {
    width: 40px;
    height: 40px;
    border: 3px solid #30343c;
    border-top-color: white;
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin: auto auto 15px;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

.historyPanel {
    display: none;
    position: absolute;
    inset: 0;
    background: #0b0d10;
    padding: 40px;
    overflow-y: auto;
    z-index: 20;
}

.historyPanel h2 {
    margin-top: 0;
}

.historyGrid {
    display: grid;
    grid-template-columns:
        repeat(
            auto-fill,
            minmax(190px, 1fr)
        );
    gap: 15px;
}

.historyCard {
    background: #15181d;
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 15px;
    cursor: pointer;
}

.historyCard:hover {
    background: #1b1e24;
}

.historyThumb {
    height: 120px;
    background: #0c0e12;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #555b64;
    margin-bottom: 10px;
}

.historyName {
    font-size: 12px;
    color: #d0d4da;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

@media(max-width: 800px) {

    body {
        overflow: auto;
    }

    .app {
        display: block;
        height: auto;
    }

    .sidebar {
        border-right: none;
        border-bottom: 1px solid var(--border);
    }

    .viewerArea {
        height: 600px;
    }

    nav {
        display: none;
    }

}

</style>

</head>

<body>

<header>

    <div class="logo">
        <div class="logoBox">3D</div>
        Forge3D
    </div>

    <nav>

        <button
            id="generateNav"
            class="active"
            onclick="showGenerate()"
        >
            Generate
        </button>

        <button
            id="modelsNav"
            onclick="showModels()"
        >
            My Models
        </button>

    </nav>

    <div class="headerRight">

        <div class="credit">
            Tripo AI
        </div>

        <div class="avatar">
            U
        </div>

    </div>

</header>


<div class="app">


<section class="sidebar">

    <h1>Create 3D</h1>

    <div class="subtitle">
        Turn your ideas into interactive 3D models.
    </div>


    <span class="label">
        Generation mode
    </span>


    <div class="modeButtons">

        <button
            class="modeButton active"
            id="textMode"
            onclick="setMode('text')"
        >
            ✨ Text to 3D
        </button>

        <button
            class="modeButton"
            id="imageMode"
            onclick="setMode('image')"
        >
            🖼 Image to 3D
        </button>

    </div>


    <div id="textInput">

        <span class="label">
            Describe your model
        </span>

        <textarea
            id="prompt"
            placeholder="Example: A military checkpoint with concrete barriers, sandbags, a guard tower and a small metal building..."
        ></textarea>

        <div class="quick">

            <button onclick="setPrompt('A military checkpoint with concrete barriers, sandbags and a guard tower')">
                🪖 Military
            </button>

            <button onclick="setPrompt('A rusty industrial warehouse with metal walls and large doors')">
                🏭 Industrial
            </button>

            <button onclick="setPrompt('A small abandoned gas station with weathered signs')">
                🏚 Building
            </button>

            <button onclick="setPrompt('A wooden watch tower with stairs and a small roof')">
                🗼 Tower
            </button>

        </div>

    </div>


    <div
        id="imageInput"
        class="uploadArea"
        style="display:none;"
    >

        <input
            id="imageFile"
            type="file"
            accept="image/png,image/jpeg,image/webp"

        <label

        >

            <div class="uploadIcon">

            <div class="uploadText">

            </div>

            <div class="uploadText">
                PNG, JPG or WebP

        </label>


        <div
            id="imageSelected"
            class="imageSelected"
        >

            <img
                id="imagePreview"
                alt="Image preview"

            <div class="imageInfo">

                </div>

                <div id="imageSize"></div>

            </div>

            <button

                class="removeImage"

        </div>

    </div>


    <div class="settings">

        <div class="setting">

                Quality

                <option>Standard</option>
                <option>High</option>
                <option>Ultra</option>

            </select>

        <div class="setting">

            <span>
                PBR Materials
            </span>

            <label class="switch">

        </div>


        <div class="setting">

            <span>
                Roblox / BRM5

            <label class="switch">

                <input
                    type="checkbox"
                    id="roblox"

                <span class="slider"></span>

        </div>


        <div class="setting">

            <span>
                Low Poly

</section>

{
    "imports": {

        "three":
            "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",

<script type="module">

import * as THREE from "three";

import {
    OrbitControls
} from "three/addons/controls/OrbitControls.js";

import {
    GLTFLoader
} from "three/addons/loaders/GLTFLoader.js";


/* =====================================================
   TRIPO CONFIG
===================================================== */

/*
   IMPORTANT:
   Put your NEW Tripo API key here.

   Do NOT paste the key into ChatGPT.

   Example:

   const TRIPO_API_KEY = "tsk_xxxxxxxxx";
*/

const TRIPO_API_KEY =
    "tcli_81879442ad94429ea418c5400d93f712";


/*
   Current Tripo API
*/
const TRIPO_BASE =
    "https://api.tripo3d.ai/v2/openapi";


/*
   Current P1 model.
   Good choice for Roblox / BRM5 / game assets.
*/
const TRIPO_MODEL =
    "P1-20260311";


/* =====================================================
   VIEWER VARIABLES
===================================================== */

let scene;
let camera;
let renderer;
let controls;
let grid;

let currentModel = null;
let currentModelURL = null;

let mode = "text";


/* =====================================================
   VIEWER
===================================================== */

function initViewer() {

    const container =
        document.getElementById("viewer");


    scene =
        new THREE.Scene();


    scene.background =
        new THREE.Color(0x0b0d10);


    camera =
        new THREE.PerspectiveCamera(
            45,
            container.clientWidth /
            container.clientHeight,
            0.01,
            1000
        );


    camera.position.set(
        4,
        3,
        6
    );


    renderer =
        new THREE.WebGLRenderer({
            antialias: true
        });


    renderer.setPixelRatio(
        Math.min(
            window.devicePixelRatio,
            2
        )
    );


    renderer.setSize(
        container.clientWidth,
        container.clientHeight
    );


    renderer.outputColorSpace =
        THREE.SRGBColorSpace;


    renderer.setAnimationLoop(
        animate
    );


    container.appendChild(
        renderer.domElement
    );


    controls =
        new OrbitControls(
            camera,
            renderer.domElement
        );


    controls.enableDamping =
        true;

    controls.dampingFactor =
        0.06;

    controls.minDistance =
        0.3;

    controls.maxDistance =
        100;


    const hemi =
        new THREE.HemisphereLight(
            0xffffff,
            0x222222,
            2
        );

    scene.add(hemi);


    const light =
        new THREE.DirectionalLight(
            0xffffff,
            3
        );

    light.position.set(
        5,
        8,
        5
    );

    scene.add(light);


    const light2 =
        new THREE.DirectionalLight(
            0xffffff,
            1.5
        );

    light2.position.set(
        -5,
        4,
        -4
    );

    scene.add(light2);


    grid =
        new THREE.GridHelper(
            20,
            20,
            0x343840,
            0x202329
        );

    scene.add(grid);


    window.addEventListener(
        "resize",
        resizeViewer
    );

}


/* =====================================================
   ANIMATION
===================================================== */

function animate() {

    if (
        !controls ||
        !renderer ||
        !scene ||
        !camera
    ) {
        return;
    }


    controls.update();


    renderer.render(
        scene,
        camera
    );

}


/* =====================================================
   RESIZE
===================================================== */

function resizeViewer() {

    const container =
        document.getElementById("viewer");


    if (!camera || !renderer)
        return;


    camera.aspect =
        container.clientWidth /
        container.clientHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(
        container.clientWidth,
        container.clientHeight
    );

}


/* =====================================================
   LOAD GLB
===================================================== */

window.loadGLB = function(url) {

    const loader =
        new GLTFLoader();


    setStatus(
        "Loading generated model..."
    );


    loader.load(

        url,

        gltf => {

            if (currentModel) {

                scene.remove(
                    currentModel
                );

            }


            currentModel =
                gltf.scene;


            scene.add(
                currentModel
            );


            centerModel(
                currentModel
            );


            document
                .getElementById("empty")
                .style.display =
                "none";


            document
                .getElementById("download")
                .disabled =
                false;


            currentModelURL =
                url;


            saveHistory(
                url
            );


            setStatus(
                "Model ready."
            );

        },

        xhr => {

            if (xhr.total) {

                const p =
                    Math.round(
                        xhr.loaded /
                        xhr.total *
                        100
                    );


                setStatus(
                    "Loading model " +
                    p +
                    "%"
                );

            }

        },

        error => {

            console.error(
                "GLB loading error:",
                error
            );


            setStatus(
                "Model generated, but Forge3D could not load the GLB."
            );

        }

    );

};


/* =====================================================
   CENTER MODEL
===================================================== */

function centerModel(model) {

    const box =
        new THREE.Box3()
            .setFromObject(model);


    const center =
        box.getCenter(
            new THREE.Vector3()
        );


    const size =
        box.getSize(
            new THREE.Vector3()
        );


    model.position.sub(
        center
    );


    const max =
        Math.max(
            size.x,
            size.y,
            size.z
        );


    const distance =
        Math.max(
            max * 2.4,
            2
        );


    camera.position.set(
        distance,
        distance * 0.7,
        distance
    );


    controls.target.set(
        0,
        0,
        0
    );


    controls.update();

}


/* =====================================================
   CAMERA
===================================================== */

window.resetCamera = function() {

    if (!currentModel)
        return;


    centerModel(
        currentModel
    );

};


/* =====================================================
   GRID
===================================================== */

window.toggleGrid = function() {

    if (!grid)
        return;


    grid.visible =
        !grid.visible;

};


/* =====================================================
   DOWNLOAD
===================================================== */

window.downloadModel = function() {

    if (!currentModelURL) {

        setStatus(
            "No model available to download."
        );

        return;

    }


    const a =
        document.createElement("a");


    a.href =
        currentModelURL;


    a.target =
        "_blank";


    a.rel =
        "noopener";


    a.download =
        "forge3d-model.glb";


    document.body.appendChild(
        a
    );


    a.click();


    a.remove();

};


/* =====================================================
   MODE
===================================================== */

window.setMode = function(newMode) {

    mode =
        newMode;


    const text =
        document.getElementById(
            "textInput"
        );


    const image =
        document.getElementById(
            "imageInput"
        );


    const textButton =
        document.getElementById(
            "textMode"
        );


    const imageButton =
        document.getElementById(
            "imageMode"
        );


    if (mode === "text") {

        text.style.display =
            "block";

        image.style.display =
            "none";

        textButton.classList.add(
            "active"
        );

        imageButton.classList.remove(
            "active"
        );

    }

    else {

        text.style.display =
            "none";

        image.style.display =
            "block";

        textButton.classList.remove(
            "active"
        );

        imageButton.classList.add(
            "active"
        );

    }


    setStatus("");

};


/* =====================================================
   IMAGE PREVIEW
===================================================== */

window.previewImage = function(event) {

    const file =
        event.target.files[0];


    if (!file)
        return;


    const allowedTypes = [
        "image/png",
        "image/jpeg",
        "image/webp"
    ];


    if (
        !allowedTypes.includes(
            file.type
        )
    ) {

        setStatus(
            "Please upload PNG, JPG or WebP."
        );

        event.target.value =
            "";

        return;

    }


    /*
       Tripo upload documentation currently
       specifies a 10 MB upload limit.
    */

    const maxSize =
        10 * 1024 * 1024;


    if (file.size > maxSize) {

        setStatus(
            "Image must be smaller than 10 MB."
        );

        event.target.value =
            "";

        return;

    }


    const img =
        document.getElementById(
            "imagePreview"
        );


    if (img.dataset.objectURL) {

        URL.revokeObjectURL(
            img.dataset.objectURL
        );

    }


    const url =
        URL.createObjectURL(
            file
        );


    img.src =
        url;


    img.dataset.objectURL =
        url;


    document.getElementById(
        "imageName"
    ).textContent =
        file.name;


    document.getElementById(
        "imageSize"
    ).textContent =
        formatFileSize(
            file.size
        );


    document.getElementById(
        "uploadBox"
    ).style.display =
        "none";


    document.getElementById(
        "imageSelected"
    ).style.display =
        "block";


    setStatus(
        "Image ready for 3D generation."
    );

};


/* =====================================================
   FILE SIZE
===================================================== */

function formatFileSize(bytes) {

    if (bytes < 1024)
        return bytes + " B";


    if (bytes < 1024 * 1024) {

        return (
            bytes / 1024
        ).toFixed(1) +
        " KB";

    }


    return (
        bytes /
        (1024 * 1024)
    ).toFixed(1) +
    " MB";

}

window.removeImage = function(event) {

/* =====================================================
   TRIPO REQUEST
===================================================== */

async function tripoRequest(
    endpoint,
    options = {}
) {

    let response;


    try {

        response =
            await fetch(
                TRIPO_BASE + endpoint,
                options
            );

    }

    catch (error) {

        throw new Error(
            "Could not connect to Tripo. This may be a browser CORS/API-key issue."
        );

    }


    let data;


    try {

        data =
            await response.json();

    }

    catch {

        throw new Error(
            `Tripo returned HTTP ${response.status}, but no valid JSON response.`
        );

    }


    console.log(
        "Tripo response:",
        data
    );


    if (
        !response.ok ||
        data.code !== 0
    ) {

        const message =
            data.message ||
            data.suggestion ||
            `Tripo API error ${response.status}`;


        throw new Error(
            message
        );

    }


    return data;

}


/* =====================================================
   CREATE TEXT TASK
===================================================== */

async function createTextTask() {

    let prompt =
        document.getElementById(
            "prompt"
        ).value.trim();


    const roblox =
        document.getElementById(
            "roblox"
        ).checked;


    const lowpoly =
        document.getElementById(
            "lowpoly"
        ).checked;


    const pbr =
        document.getElementById(
            "pbr"
        ).checked;


    const quality =
        document.getElementById(
            "quality"
        ).value;


    if (!prompt) {

        prompt =
            "A detailed game-ready 3D object";

    }


    if (roblox) {

        prompt +=
            ", optimized for Roblox, game-ready, efficient geometry, suitable for Roblox";

    }


    if (lowpoly) {

        prompt +=
            ", low polygon geometry, clean simple topology";

    }


    const body = {

        type:
            "text_to_model",

        model_version:
            TRIPO_MODEL,

        prompt:
            prompt,

        texture:
            true,

        pbr:
            pbr

    };


    if (quality === "Standard") {

        body.texture_quality =
            "standard";

    }

    else if (quality === "High") {

        body.texture_quality =
            "detailed";

    }

    else if (quality === "Ultra") {

        body.texture_quality =
            "extreme";

    }


    if (roblox || lowpoly) {

        body.face_limit =
            lowpoly
                ? 5000
                : 10000;

    }


    setStatus(
        "Sending prompt to Tripo..."
    );


    document.getElementById(
        "loadingText"
    ).textContent =
        "Starting Tripo generation...";


    const data =
        await tripoRequest(

            "/task",

            {

                method:
                    "POST",

                headers: {

                    "Authorization":
                        `Bearer ${TRIPO_API_KEY}`,

                    "Content-Type":
                        "application/json"

                },

                body:
                    JSON.stringify(body)

            }

        );


    return data.data.task_id;

}


/* =====================================================
   UPLOAD IMAGE
===================================================== */

async function uploadImageToTripo(file) {

    setStatus(
        "Uploading image to Tripo..."
    );


    document.getElementById(
        "loadingText"
    ).textContent =
        "Uploading image...";


    const formData =
        new FormData();


    formData.append(
        "file",
        file,
        file.name
    );


    const data =
        await tripoRequest(

            "/upload/sts",

            {

                method:
                    "POST",

                headers: {

                    "Authorization":
                        `Bearer ${TRIPO_API_KEY}`

                },

                body:
                    formData

            }

        );


    /*
       Current Tripo upload response
       returns image_token.
    */

    const imageToken =
        data.data &&
        (
            data.data.image_token ||
            data.data.file_token
        );


    if (!imageToken) {

        console.error(
            "Upload response:",
            data
        );


        throw new Error(
            "Tripo uploaded the image but did not return an image token."
        );

    }


    return imageToken;

}


/* =====================================================
   CREATE IMAGE TASK
===================================================== */

async function createImageTask(
    imageToken,
    fileType
) {

    const roblox =
        document.getElementById(
            "roblox"
        ).checked;


    const lowpoly =
        document.getElementById(
            "lowpoly"
        ).checked;


    const pbr =
        document.getElementById(
            "pbr"
        ).checked;


    const quality =
        document.getElementById(
            "quality"
        ).value;


    let type =
        fileType;


    if (type === "image/jpeg")
        type = "jpg";

    else if (type === "image/png")
        type = "png";

    else if (type === "image/webp")
        type = "webp";


    const body = {

        type:
            "image_to_model",

        model_version:
            TRIPO_MODEL,

        file: {

            type:
                type,

            file_token:
                imageToken

        },

        texture:
            true,

        pbr:
            pbr

    };


    if (quality === "Standard") {

        body.texture_quality =
            "standard";

    }

    else if (quality === "High") {

        body.texture_quality =
            "detailed";

    }

    else if (quality === "Ultra") {

        body.texture_quality =
            "extreme";

    }


    if (roblox || lowpoly) {

        body.face_limit =
            lowpoly
                ? 5000
                : 10000;

    }


    setStatus(
        "Creating 3D model from image..."
    );


    document.getElementById(
        "loadingText"
    ).textContent =
        "Creating 3D model...";


    const data =
        await tripoRequest(

            "/task",

            {

                method:
                    "POST",

                headers: {

                    "Authorization":
                        `Bearer ${TRIPO_API_KEY}`,

                    "Content-Type":
                        "application/json"

                },

                body:
                    JSON.stringify(body)

            }

        );


    return data.data.task_id;

}


/* =====================================================
   GET TASK
===================================================== */

async function getTripoTask(taskId) {

    return await tripoRequest(

        `/task/${taskId}`,

        {

            method:
                "GET",

            headers: {

                "Authorization":
                    `Bearer ${TRIPO_API_KEY}`

            }

        }

    );

}


/* =====================================================
   POLL TASK
===================================================== */

async function waitForTripoModel(taskId) {

    const maxAttempts =
        300;


    for (
        let attempt = 0;
        attempt < maxAttempts;
        attempt++
    ) {

        await new Promise(
            resolve =>
                setTimeout(
                    resolve,
                    2000
                )
        );


        const data =
            await getTripoTask(
                taskId
            );


        const task =
            data.data;


        console.log(
            "Task:",
            task
        );


        const status =
            task.status;


        const progress =
            Number(
                task.progress || 0
            );


        if (status === "queued") {

            setStatus(
                "Tripo has queued your model..."
            );


            document.getElementById(
                "loadingText"
            ).textContent =
                "Waiting in queue...";

        }


        else if (status === "running") {

            setStatus(
                `Generating model... ${progress}%`
            );


            document.getElementById(
                "loadingText"
            ).textContent =
                `Generating model... ${progress}%`;

        }


        else if (status === "success") {

            /*
               Tripo's output can contain
               different model file fields.

               Check all common GLB locations.
            */

            const output =
                task.output || {};


            const modelURL =
                output.model ||
                output.model_url ||
                output.pbr_model ||
                output.base_model ||
                output.glb;


            if (!modelURL) {

                console.error(
                    "Successful task without model URL:",
                    task
                );


                throw new Error(
                    "Tripo finished, but no GLB model URL was returned."
                );

            }


            setStatus(
                "Model generated. Loading into Forge3D..."
            );


            document.getElementById(
                "loadingText"
            ).textContent =
                "Loading model...";


            window.loadGLB(
                modelURL
            );


            return;

        }


        else if (status === "failed") {

            throw new Error(
                task.message ||
                task.error ||
                "Tripo generation failed."
            );

        }


        else if (status === "banned") {

            throw new Error(
                "Tripo blocked this generation."
            );

        }

    }


    throw new Error(
        "Generation took too long. Check your Tripo account."
    );

}


/* =====================================================
   GENERATE
===================================================== */

window.generate = async function() {

    const button =
        document.getElementById(
            "generateButton"
        );


    const loading =
        document.getElementById(
            "loading"
        );


    const loadingText =
        document.getElementById(
            "loadingText"
        );


    if (
        !TRIPO_API_KEY ||
        TRIPO_API_KEY.includes(
            "PASTE_YOUR_NEW_TRIPO_KEY_HERE"
        )
    ) {

        setStatus(
            "Add your new Tripo API key near the top of this file."
        );

        return;

    }


    button.disabled =
        true;


    loading.style.display =
        "block";


    loadingText.textContent =
        "Starting...";


    try {

        let taskId;


        /* IMAGE */

        if (mode === "image") {

            const imageFile =
                document.getElementById(
                    "imageFile"
                ).files[0];


            if (!imageFile) {

                throw new Error(
                    "Upload an image first."
                );

            }


            const imageToken =
                await uploadImageToTripo(
                    imageFile
                );


            taskId =
                await createImageTask(
                    imageToken,
                    imageFile.type
                );

        }


        /* TEXT */

        else {

            taskId =
                await createTextTask();

        }


        setStatus(
            "Tripo task created. Generating..."
        );


        await waitForTripoModel(
            taskId
        );

    }


    catch (error) {

        console.error(
            "Forge3D generation error:",
            error
        );


        setStatus(
            "Error: " +
            error.message
        );


        loadingText.textContent =
            "Generation failed.";

    }


    finally {

        button.disabled =
            false;


        setTimeout(() => {

            loading.style.display =
                "none";

        }, 1200);

    }

};

/* =====================================================
   HISTORY
===================================================== */

function saveHistory(url) {

    let history =
        JSON.parse(
            localStorage.getItem(
                "forge3d-history"
            ) || "[]"
        );


    history.unshift({

        url:
            url,

        date:
            Date.now()

    });


    history =
        history.slice(
            0,
            20
        );


    localStorage.setItem(
        "forge3d-history",
        JSON.stringify(history)
    );


    renderHistory();

}


/* =====================================================
   HISTORY
===================================================== */

function renderHistory() {

    const grid =
        document.getElementById(
            "historyGrid"
        );


    let history =
        JSON.parse(
            localStorage.getItem(
                "forge3d-history"
            ) || "[]"
        );


    grid.innerHTML =
        "";


    if (!history.length) {

        grid.innerHTML = `

            <div style="
                color:#777d86;
                font-size:13px;
                padding:20px 0;
            ">
                No generated models yet.
            </div>

        `;

        return;

    }


    history.forEach(
        (item, index) => {

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "historyCard";


            card.innerHTML = `

                <div class="historyThumb">
                    3D MODEL
                </div>

                <div class="historyName">
                    Generated Model ${index + 1}
                </div>

            `;


            card.onclick =
                () => {

                    loadGLB(
                        item.url
                    );


                    showGenerate();

                };


            grid.appendChild(
                card
            );

        }
    );

}
