<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Forge3D — AI 3D Generator</title> <style> * { box-sizing: border-box; } :root { --bg: #090a0d; --panel: #101216; --panel2: #15171c; --border: #272a31; --text: #f5f5f5; --muted: #8d929c; --accent: #ffffff; --accentText: #08090b; } body { margin: 0; background: var(--bg); color: var(--text); font-family: Arial, Helvetica, sans-serif; height: 100vh; overflow: hidden; } /* HEADER */ header { height: 64px; border-bottom: 1px solid var(--border); background: #0c0e11; display: flex; align-items: center; padding: 0 22px; } .logo { display: flex; align-items: center; gap: 11px; font-size: 18px; font-weight: 700; } .logoBox { width: 34px; height: 34px; border-radius: 9px; background: white; color: black; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 900; } nav { margin-left: 45px; display: flex; gap: 5px; } nav button { background: transparent; border: none; color: var(--muted); padding: 9px 14px; border-radius: 7px; cursor: pointer; } nav button:hover, nav button.active { color: white; background: #1b1e24; } .headerRight { margin-left: auto; display: flex; align-items: center; gap: 12px; } .credit { border: 1px solid var(--border); background: #15171c; padding: 8px 12px; border-radius: 7px; color: #aaaeb7; font-size: 12px; } .avatar { width: 32px; height: 32px; border-radius: 50%; background: #272a31; display: flex; align-items: center; justify-content: center; font-size: 12px; } /* LAYOUT */ .app { height: calc(100vh - 64px); display: grid; grid-template-columns: 370px 1fr; } /* SIDEBAR */ .sidebar { border-right: 1px solid var(--border); padding: 27px; overflow-y: auto; } .sidebar h1 { margin: 0; font-size: 27px; } .subtitle { color: var(--muted); font-size: 13px; line-height: 1.5; margin-top: 8px; margin-bottom: 27px; } .label { font-size: 12px; color: #bfc3ca; margin-bottom: 8px; display: block; } /* MODE */ .modeButtons { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; margin-bottom: 22px; } .modeButton { border: 1px solid var(--border); background: #14161b; color: #969ba4; padding: 11px; border-radius: 8px; cursor: pointer; font-size: 12px; } .modeButton.active { background: #22252b; color: white; border-color: #42464e; } /* PROMPT */ textarea { width: 100%; height: 145px; resize: vertical; background: #13151a; border: 1px solid var(--border); border-radius: 9px; color: white; padding: 13px; font-family: inherit; font-size: 13px; line-height: 1.5; outline: none; } textarea:focus { border-color: #555a63; } .quick { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; } .quick button { border: 1px solid var(--border); background: #14161a; color: #999fa8; border-radius: 6px; padding: 6px 8px; font-size: 10px; cursor: pointer; } .quick button:hover { color: white; background: #1d2026; } /* IMAGE UPLOAD */ .upload { display: none; border: 1px dashed #3a3e47; border-radius: 9px; min-height: 145px; align-items: center; justify-content: center; flex-direction: column; cursor: pointer; background: #121419; text-align: center; } .upload:hover { background: #181b21; } .uploadIcon { font-size: 28px; margin-bottom: 8px; } .uploadText { font-size: 12px; color: #a7acb5; } #imagePreview { max-width: 100%; max-height: 120px; margin-top: 10px; border-radius: 7px; display: none; } /* SETTINGS */ .settings { margin-top: 23px; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); padding: 12px 0; } .setting { display: flex; align-items: center; justify-content: space-between; padding: 9px 0; color: #b6bac2; font-size: 12px; } select { background: #17191e; color: white; border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; } /* TOGGLE */ .switch { position: relative; width: 35px; height: 19px; } .switch input { display: none; } .slider { position: absolute; inset: 0; background: #292c32; border-radius: 20px; cursor: pointer; } .slider:before { content: ""; position: absolute; width: 15px; height: 15px; left: 2px; top: 2px; background: #858a93; border-radius: 50%; transition: .2s; } input:checked + .slider { background: #eeeeee; } input:checked + .slider:before { transform: translateX(16px); background: #111; } /* GENERATE */ .generate { width: 100%; margin-top: 20px; border: none; border-radius: 8px; background: white; color: black; padding: 13px; font-weight: 700; cursor: pointer; display: flex; justify-content: space-between; align-items: center; } .generate:hover { background: #dedede; } .generate:disabled { opacity: .45; cursor: wait; } .status { min-height: 24px; margin-top: 10px; font-size: 11px; color: #888e98; } /* VIEWER */ .viewerArea { position: relative; background: radial-gradient( circle at center, #1b1e24 0%, #0a0b0e 65% ); } #viewer { position: absolute; inset: 0; } .empty { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); text-align: center; pointer-events: none; color: #707680; } .emptyCube { width: 80px; height: 80px; border: 1px solid #373b43; border-radius: 13px; margin: auto auto 20px; display: flex; align-items: center; justify-content: center; font-weight: 900; color: #555a63; } .empty h2 { color: #a8adb5; font-size: 16px; margin: 0 0 6px; } .empty p { font-size: 12px; margin: 0; } /* VIEWER CONTROLS */ .viewerControls { position: absolute; right: 20px; bottom: 20px; display: flex; gap: 7px; } .viewerControls button { border: 1px solid #30343c; background: #15181d; color: white; border-radius: 7px; padding: 9px 12px; cursor: pointer; font-size: 11px; } .viewerControls button:hover { background: #22262c; } .viewerControls button:disabled { opacity: .35; cursor: not-allowed; } /* LOADING */ .loading { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); text-align: center; display: none; } .spinner { width: 40px; height: 40px; border: 3px solid #30343c; border-top-color: white; border-radius: 50%; animation: spin 1s linear infinite; margin: auto auto 15px; } @keyframes spin { to { transform: rotate(360deg); } } /* HISTORY */ .historyPanel { display: none; position: absolute; inset: 0; background: #0b0d10; padding: 40px; overflow-y: auto; } .historyPanel h2 { margin-top: 0; } .historyGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 15px; } .historyCard { background: #15181d; border: 1px solid var(--border); border-radius: 9px; padding: 15px; } .historyThumb { height: 120px; background: #0c0e12; border-radius: 6px; display: flex; align-items: center; justify-content: center; color: #555b64; margin-bottom: 10px; } .historyName { font-size: 12px; color: #d0d4da; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } /* RESPONSIVE */ @media(max-width: 800px) { body { overflow: auto; } .app { display: block; height: auto; } .sidebar { border-right: none; border-bottom: 1px solid var(--border); } .viewerArea { height: 600px; } nav { display: none; } } </style> </head> <body> <header> <div class="logo"> <div class="logoBox"> 3D </div> Forge3D </div> <nav> <button id="generateNav" class="active" onclick="showGenerate()" > Generate </button> <button id="modelsNav" onclick="showModels()" > My Models </button> </nav> <div class="headerRight"> <div class="credit"> Free Preview </div> <div class="avatar"> U </div> </div> </header> <div class="app"> <!-- SIDEBAR --> <section class="sidebar"> <h1> Create 3D </h1> <div class="subtitle"> Turn your ideas into interactive 3D models. </div> <span class="label"> Generation mode </span> <div class="modeButtons"> <button class="modeButton active" id="textMode" onclick="setMode('text')" > ✨ Text to 3D </button> <button class="modeButton" id="imageMode" onclick="setMode('image')" > 🖼 Image to 3D </button> </div> <!-- TEXT MODE --> <div id="textInput"> <span class="label"> Describe your model </span> <textarea id="prompt" placeholder="Example: A military checkpoint with concrete barriers, sandbags, a guard tower and a small metal building..." ></textarea> <div class="quick"> <button onclick="setPrompt('A military checkpoint with concrete barriers, sandbags and a guard tower')"> 🪖 Military </button> <button onclick="setPrompt('A rusty industrial warehouse with metal walls and large doors')"> 🏭 Industrial </button> <button onclick="setPrompt('A small abandoned gas station with weathered signs')"> 🏚 Building </button> <button onclick="setPrompt('A wooden watch tower with stairs and a small roof')"> 🗼 Tower </button> </div> </div> <!-- IMAGE MODE --> <label class="upload" id="imageInput" for="imageFile" > <div class="uploadIcon"> ↑ </div> <div class="uploadText"> Click to upload an image </div> <div class="uploadText"> PNG or JPG </div> <img id="imagePreview"> </label> <input id="imageFile" type="file" accept="image/png,image/jpeg" hidden onchange="previewImage(event)" > <!-- SETTINGS --> <div class="settings"> <div class="setting"> <span> Quality </span> <select id="quality"> <option> Standard </option> <option> High </option> <option> Ultra </option> </select> </div> <div class="setting"> <span> PBR Materials </span> <label class="switch"> <input type="checkbox" id="pbr" checked > <span class="slider"></span> </label> </div> <div class="setting"> <span> Roblox / BRM5 </span> <label class="switch"> <input type="checkbox" id="roblox" > <span class="slider"></span> </label> </div> <div class="setting"> <span> Low Poly </span> <label class="switch"> <input type="checkbox" id="lowpoly" > <span class="slider"></span> </label> </div> </div> <button class="generate" id="generateButton" onclick="generate()" > <span> Generate 3D Model </span> <span> → </span> </button> <div class="status" id="status" ></div> </section> <!-- VIEWER --> <section class="viewerArea"> <div id="viewer"></div> <div class="empty" id="empty" > <div class="emptyCube"> 3D </div> <h2> Your model will appear here </h2> <p> Describe something and generate your first model. </p> </div> <div class="loading" id="loading" > <div class="spinner"></div> <div id="loadingText"> Creating model... </div> </div> <div class="viewerControls"> <button onclick="resetCamera()"> Reset View </button> <button onclick="toggleGrid()"> Grid </button> <button id="download" onclick="downloadModel()" disabled > Download GLB </button> </div> <!-- HISTORY --> <div class="historyPanel" id="history" > <h2> My Models </h2> <div class="historyGrid" id="historyGrid" ></div> </div> </section> </div> <!-- THREE.JS --> <script type="importmap"> { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } } </script> <script type="module"> import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"; import { OrbitControls } from "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/controls/OrbitControls.js"; import { GLTFLoader } from "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/loaders/GLTFLoader.js"; let scene; let camera; let renderer; let controls; let grid; let currentModel = null; let currentModelURL = null; let mode = "text"; /* ============================== THREE VIEWER ================================ */ function initViewer() { const container = document.getElementById("viewer"); scene = new THREE.Scene(); scene.background = new THREE.Color(0x0b0d10); camera = new THREE.PerspectiveCamera( 45, container.clientWidth / container.clientHeight, 0.01, 1000 ); camera.position.set( 4, 3, 6 ); renderer = new THREE.WebGLRenderer({ antialias: true }); renderer.setPixelRatio( Math.min( window.devicePixelRatio, 2 ) ); renderer.setSize( container.clientWidth, container.clientHeight ); renderer.outputColorSpace = THREE.SRGBColorSpace; container.appendChild( renderer.domElement ); controls = new OrbitControls( camera, renderer.domElement ); controls.enableDamping = true; controls.dampingFactor = .06; controls.minDistance = .3; controls.maxDistance = 100; /* LIGHTING */ const hemi = new THREE.HemisphereLight( 0xffffff, 0x222222, 2 ); scene.add(hemi); const light = new THREE.DirectionalLight( 0xffffff, 3 ); light.position.set( 5, 8, 5 ); scene.add(light); const light2 = new THREE.DirectionalLight( 0xffffff, 1.5 ); light2.position.set( -5, 4, -4 ); scene.add(light2); /* GRID */ grid = new THREE.GridHelper( 20, 20, 0x343840, 0x202329 ); scene.add(grid); window.addEventListener( "resize", resizeViewer ); animate(); } function animate() { requestAnimationFrame( animate ); controls.update(); renderer.render( scene, camera ); } function resizeViewer() { const container = document.getElementById("viewer"); camera.aspect = container.clientWidth / container.clientHeight; camera.updateProjectionMatrix(); renderer.setSize( container.clientWidth, container.clientHeight ); } /* ============================== LOAD GLB ================================ */ window.loadGLB = function(url) { const loader = new GLTFLoader(); loader.load( url, gltf => { if (currentModel) { scene.remove( currentModel ); } currentModel = gltf.scene; scene.add( currentModel ); centerModel( currentModel ); document .getElementById("empty") .style.display = "none"; document .getElementById("download") .disabled = false; currentModelURL = url; saveHistory( url ); }, xhr => { if (xhr.total) { const p = Math.round( xhr.loaded / xhr.total * 100 ); setStatus( "Loading model " + p + "%" ); } }, error => { console.error(error); setStatus( "Unable to load the model." ); } ); }; function centerModel(model) { const box = new THREE.Box3() .setFromObject(model); const center = box.getCenter( new THREE.Vector3() ); const size = box.getSize( new THREE.Vector3() ); model.position.sub( center ); const max = Math.max( size.x, size.y, size.z ); const distance = max * 2.4; camera.position.set( distance, distance * .7, distance ); controls.target.set( 0, 0, 0 ); controls.update(); } /* ============================== CAMERA ================================ */ window.resetCamera = function() { if (!currentModel) return; centerModel( currentModel ); }; /* ============================== GRID ================================ */ window.toggleGrid = function() { grid.visible = !grid.visible; }; /* ============================== DOWNLOAD ================================ */ window.downloadModel = function() { if (!currentModelURL) return; const a = document.createElement("a"); a.href = currentModelURL; a.target = "_blank"; a.download = "forge3d-model.glb"; document.body.appendChild(a); a.click(); a.remove(); }; /* ============================== MODE ================================ */ window.setMode = function(newMode) { mode = newMode; const text = document.getElementById( "textInput" ); const image = document.getElementById( "imageInput" ); const textButton = document.getElementById( "textMode" ); const imageButton = document.getElementById( "imageMode" ); if (mode === "text") { text.style.display = "block"; image.style.display = "none"; textButton.classList.add( "active" ); imageButton.classList.remove( "active" ); } else { text.style.display = "none"; image.style.display = "flex"; textButton.classList.remove( "active" ); imageButton.classList.add( "active" ); } }; /* ============================== IMAGE PREVIEW ================================ */ window.previewImage = function(event) { const file = event.target.files[0]; if (!file) return; const img = document.getElementById( "imagePreview" ); img.src = URL.createObjectURL( file ); img.style.display = "block"; }; /* ============================== PROMPT ================================ */ window.setPrompt = function(text) { document.getElementById( "prompt" ).value = text; }; /* ============================== GENERATE ================================ */ window.generate = async function() { const button = document.getElementById( "generateButton" ); button.disabled = true; document.getElementById( "loading" ).style.display = "block"; let prompt = document.getElementById( "prompt" ).value.trim(); const roblox = document.getElementById( "roblox" ).checked; const lowpoly = document.getElementById( "lowpoly" ).checked; const pbr = document.getElementById( "pbr" ).checked; if (!prompt) { prompt = "A detailed game-ready 3D object"; } if (roblox) { prompt += ", optimized for Roblox, game-ready, efficient geometry"; } if (lowpoly) { prompt += ", low polygon geometry"; } if (pbr) { prompt += ", PBR materials"; } /* DEMO MODE This is intentionally not calling an AI API because a GitHub Pages website cannot safely store an API key. Once you connect a backend, replace this section with your API request. */ setStatus( "Demo mode — AI API not connected yet." ); let progress = 0; const interval = setInterval(() => { progress += 10; document.getElementById( "loadingText" ).textContent = "Preparing AI generation... " + progress + "%"; if (progress >= 100) { clearInterval(interval); document.getElementById( "loading" ).style.display = "none"; button.disabled = false; setStatus( "Connect an AI 3D API to generate real models." ); } }, 150); }; /* ============================== STATUS ================================ */ function setStatus(text) { document.getElementById( "status" ).textContent = text; } /* ============================== HISTORY ================================ */ function saveHistory(url) { let history = JSON.parse( localStorage.getItem( "forge3d-history" ) || "[]" ); history.unshift({ url: url, date: Date.now() }); history = history.slice( 0, 20 ); localStorage.setItem( "forge3d-history", JSON.stringify(history) ); renderHistory(); } function renderHistory() { const grid = document.getElementById( "historyGrid" ); let history = JSON.parse( localStorage.getItem( "forge3d-history" ) || "[]" ); grid.innerHTML = ""; history.forEach( (item, index) => { const card = document.createElement( "div" ); card.className = "historyCard"; card.innerHTML = ` <div class="historyThumb"> 3D MODEL </div> <div class="historyName"> Generated Model ${index + 1} </div> `; card.onclick = () => { loadGLB( item.url ); showGenerate(); }; grid.appendChild( card ); } ); } /* ============================== NAVIGATION ================================ */ window.showModels = function() { document.getElementById( "history" ).style.display = "block"; document.getElementById( "modelsNav" ).classList.add( "active" ); document.getElementById( "generateNav" ).classList.remove( "active" ); renderHistory(); }; window.showGenerate = function() { document.getElementById( "history" ).style.display = "none"; document.getElementById( "generateNav" ).classList.add( "active" ); document.getElementById( "modelsNav" ).classList.remove( "active" ); }; initViewer(); renderHistory(); </script> </body> </html>
